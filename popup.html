<!DOCTYPE html>
<html>
    <head>
        <style>
            body { width: 220px; font-family: sans-serif; padding: 12px; background-color: #0ab0a5; }
            button { width: 100%; padding: 8px; margin-top: 8px; color:rgba(143, 202, 254, 0.438);}
            textarea { width: 100%; height: 80px; margin-top: 8px;  background: #f7cf85;}
            input { background: #f7cf85; }
            .save-confirmation {
                text-align: center;
                font-weight: bold;
                color: white;
                background: #111;
                border-radius: 8px;
                margin-top: 8px;
            }
            body.blast-off {
                animation: blastOff 0.45s ease-in forwards;
            }

            @keyframes blastOff {
                0% {
                    transform: translateY(0) scale(1);
                    opacity: 1;
                }
                60% {
	                    transform: translateY(-10px) scale(1.05) rotate(-2deg);
                    opacity: 1;
                }
                100% {
                    transform: translateY(-90px) scale(0.5) rotate(8deg);
                    opacity: 0;
                }

            }
        </style>
    </head>
    <body>
       <h1 id="status" style="text-align: center; margin-top: 0;">Ready to save</h1>
       <input id="title" placeholder="Title">
         <textarea id="note" placeholder="Short note"></textarea>
        <select id="category">
            <option value="coding">Coding</option>
            <option value="recipes">Recipes</option>
            <option value="places">Places</option>
            <option value="random" selected>Random</option>
        </select>
        <label><input type="radio" name="capture-type" value="note" checked> Note</label>
        <label><input type="radio" name="capture-type" value="page"> Page</label>
        <button id="save-card-btn">Save</button>
        <div class="save-confirmation" hidden>Saved!</div>
        <button id="open-scrapbook-btn" style="background-color: aquamarine;">Open My Scrapbook</button>

        <script src="browser-polyfill-min.js"></script>
        <script src="storage.js"></script>
        <script src="popup.js"></script>
        
    </body>
</html>
