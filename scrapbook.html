<!DOCTYPE html>
<html>
<head>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Patrick+Hand&display=swap" rel="stylesheet">
  <style>
    body { font-family: sans-serif; background: #f5ecdd; padding: 24px; margin: 0;}
    h1 { text-align: center; font-size: 5rem;}
    .tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 24px; }
    .tabs button { padding: 6px 14px; border-radius: 16px; border: 1px solid #ccc; background: white; cursor: pointer; transition: transform 0.15s ease; }
    .tabs button.active { background: #333; color: white; }
    .tabs button:hover { background: #ffb703; transform: translateY(-5px); }
    .tabs button.active:hover { background: #333; color: white; transform: translateY(5px); }
    #board { position: relative; width: 100%; height: 2000px; }
    .card {
      position: absolute; width: 220px; min-height: 140px; padding: 12px;
      border-radius: 6px; box-shadow: 2px 4px 10px rgba(0,0,0,0.15);
      cursor: grab; font-size: 14px; display: flex; flex-direction: column; justify-content: space-between;
    }
    .card:active { cursor: grabbing; }
    .card .title { font-weight: bold; margin-bottom: 6px; overflow-wrap: anywhere; word-break: break-word; }
    .card .note { font-size: 12px; color: #444;  overflow-wrap: anywhere; word-break: break-word; }
  </style>
</head>
<body>
  <h1>My Little Scrapbook</h1>
  <div class="tabs">
    <button data-cat="all" class="active">All</button>
    <button data-cat="coding">Coding Ideas</button>
    <button data-cat="recipes">Recipes</button>
    <button data-cat="places">Places</button>
    <button data-cat="random">Random</button>
  </div>
  <div id="board"></div>
  <script src="browser-polyfill-min.js"></script>
  <script src="storage.js"></script>
  <script src="scrapbook.js"></script>

</body>
</html>
